[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plantakeoff"
version = "0.1.0"
description = "Plan takeoff math: scales and calibration, lengths, areas with cutouts, counts, volumes, assemblies and estimate rollup."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Will Whitmire" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["pytest", "reportlab>=4", "pypdf>=4", "playwright>=1.40", "pillow>=10.1", "pikepdf>=8", "openpyxl>=3.1"]

[project.scripts]
plantakeoff = "plantakeoff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: the large plan set performance check (deselect with -m \"not slow\")"]
